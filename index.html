<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مقاومات التوازي</title>
<meta name="theme-color" content="#14213d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#f3f1ec; --panel:#ffffff; --ink:#14213d; --muted:#5b6478; --line:#d9d5ca; --accent:#1f6f5c; --err:#b3261e;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1626;--panel:#18223a;--ink:#eef1f7;--muted:#9aa5bd;--line:#2a3654;--accent:#5fd0b0;--err:#ff8a80}}
:root[data-theme="dark"]{--bg:#0f1626;--panel:#18223a;--ink:#eef1f7;--muted:#9aa5bd;--line:#2a3654;--accent:#5fd0b0;--err:#ff8a80}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:460px;padding:24px 18px 40px}
h1{font-size:1.5rem;margin:8px 0 4px}
p.sub{margin:0 0 20px;color:var(--muted);font-size:.95rem}
.formula{direction:ltr;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;font-family:Georgia,"Times New Roman",serif;font-size:1.05rem;margin-bottom:18px}
label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:6px}
input{width:100%;font-size:1.5rem;padding:14px;border:2px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);direction:ltr;text-align:left}
input:focus{outline:3px solid var(--accent);border-color:var(--accent)}
button{width:100%;margin-top:12px;font-size:1.3rem;padding:14px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
:root:not([data-theme="light"]) button{color:#0f1626}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.result{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;min-height:110px}
.result .val{direction:ltr;text-align:center;font-size:2.2rem;font-weight:700}
.result .note{text-align:center;color:var(--muted);font-size:.9rem;margin-top:6px}
.result.error .val{color:var(--err);font-size:1.2rem}
#sp{background:transparent;color:var(--ink);border:2px solid var(--line);font-size:1.1rem;margin-top:10px}
#install{display:none;background:transparent;color:var(--ink);border:1px solid var(--line);font-size:1rem;margin-top:26px}
</style>
</head>
<body>
<main>
  <h1>المقاومة المكافئة على التوازي</h1>
  <p class="sub">اكتب القيم بالأوم، مفصولة بمسافة (مثال: 10 20 30)</p>
  <div class="formula">1/Req = 1/R₁ + 1/R₂ + … + 1/Rₙ</div>

  <label for="inp">المقاومات (Ω)</label>
  <input id="inp" type="text" inputmode="decimal" autocomplete="off" placeholder="10 20 30" enterkeyhint="done">
  <button id="sp" type="button" aria-label="إضافة مسافة">␣ مسافة</button>
  <button id="ok" type="button">OK</button>

  <div class="result" id="res" aria-live="polite">
    <div class="val" id="val">—</div>
    <div class="note" id="note">النتيجة هتظهر هنا</div>
  </div>

  <button id="install" type="button">ثبّت التطبيق على الموبايل</button>
</main>

<script>
function parallelResistance(rs){
  if(!rs.length) throw new Error("اكتب مقاومة واحدة على الأقل");
  if(rs.some(r=>r<0)) throw new Error("المقاومة لازم تكون موجبة");
  if(rs.some(r=>r===0)) return 0;
  return 1/rs.reduce((s,r)=>s+1/r,0);
}
const inp=document.getElementById('inp'), res=document.getElementById('res'),
      val=document.getElementById('val'), note=document.getElementById('note');

function calc(){
  res.classList.remove('error');
  try{
    const parts=inp.value.replace(/[،,]/g,' ').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).trim().split(/\s+/).filter(Boolean);
    const nums=parts.map(p=>{const n=Number(p); if(!isFinite(n)) throw new Error("قيمة غير صحيحة: "+p); return n;});
    const r=parallelResistance(nums);
    val.textContent=(Math.round(r*10000)/10000)+" Ω";
    note.textContent=nums.length+" مقاومات على التوازي";
    if(nums.length===1) note.textContent="مقاومة واحدة";
  }catch(e){
    res.classList.add('error'); val.textContent=e.message; note.textContent="";
  }
  // عملية جديدة تلقائيًا
  inp.value=""; inp.focus();
}
document.getElementById('ok').addEventListener('click',calc);
const sp=document.getElementById('sp');
sp.addEventListener('mousedown',e=>e.preventDefault());
sp.addEventListener('click',()=>{
  const a=inp.selectionStart??inp.value.length, b=inp.selectionEnd??a;
  inp.value=inp.value.slice(0,a)+' '+inp.value.slice(b);
  inp.focus(); inp.setSelectionRange(a+1,a+1);
});
inp.addEventListener('keydown',e=>{ if(e.key==='Enter') calc(); });

// زر التثبيت (بيظهر لما المتصفح يسمح بيه)
let deferred;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault(); deferred=e;
  const b=document.getElementById('install'); b.style.display='block';
  b.onclick=()=>{deferred.prompt(); b.style.display='none';};
});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
</body>
</html>
